name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The repo is a pnpm workspace (see pnpm-workspace.yaml +
      # packageManager field in package.json). Several packages — most
      # notably packages/site — use the `workspace:*` protocol, which
      # npm does NOT understand. We set up pnpm BEFORE actions/setup-node
      # so that step's `cache: 'pnpm'` finds a pnpm executable on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      # Build the widget first so workspace consumers (examples/react,
      # packages/site) can resolve @geochatbot/widget type declarations
      # during typecheck.
      - name: Build widget
        run: pnpm --filter @geochatbot/widget build

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: Build (all)
        run: pnpm -r --if-present run build

      - name: Hello
        run: pnpm run hello
