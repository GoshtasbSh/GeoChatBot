name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci || npm install

      - name: Lint (Biome, soft-fail)
        run: npm run lint || echo "lint surfaced issues — not blocking Phase 0 CI"

      # Build the widget first so workspace consumers (examples/react) can
      # resolve @geochatbot/widget type declarations during typecheck.
      - name: Build widget
        run: npm run build --workspace=@geochatbot/widget

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (all)
        run: npm run build

      - name: Hello
        run: npm run hello
